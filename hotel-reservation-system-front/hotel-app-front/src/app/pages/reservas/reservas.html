<section class="reservas-container">
  <header class="page-header">
    <h2>Mapa de Reservas</h2>
    <div class="header-actions">
      <div class="timeline-controls">
        <button type="button" class="btn-nav" (click)="voltarData()">Anterior</button>
        <span class="timeline-range">
          {{ dias[0] | date:'dd/MM' }} - {{ dias[dias.length - 1] | date:'dd/MM' }}
        </span>
        <button type="button" class="btn-nav" (click)="avancarData()">Proximos</button>
      </div>
      <div class="creation-actions">
        <button class="btn-primary btn-primary-soft" (click)="alterarFormularioReserva()">
          {{ mostrarFormReserva ? 'Cancelar Reserva' : 'Criar Reserva' }}
        </button>
      </div>
    </div>
  </header>

  <reserva-detalhes-modal
    *ngIf="reservaSelecionada"
    [reserva]="reservaSelecionada"
    (fechar)="fecharDetalhesReserva()"
    (cancelar)="deletarReservaSelecionada()"
    (checkin)="realizarCheckIn()"
    (caixa)="abrirCaixa()">
</reserva-detalhes-modal>

  <div *ngIf="mostrarForm" class="form-card">
    <div class="card-header">
      <h3>Novo Quarto</h3>
      <button type="button" class="form-close" aria-label="Fechar cadastro de quarto" title="Fechar" (click)="alterarFormularioQuarto()">&times;</button>
    </div>
    <form class="form-grid">
      <input type="text" [(ngModel)]="novoQuarto.numero" placeholder="Numero do quarto" name="numero">
      <input type="text" [(ngModel)]="novoQuarto.tipo" placeholder="Tipo (ex: Suite Luxo)" name="tipo">
      <button type="button" class="btn-secondary" (click)="criarQuarto()">Salvar Quarto</button>
    </form>
  </div>

  <div *ngIf="mostrarFormReserva" class="form-card form-card-reserva">
    <div class="card-header">
      <h3>Nova Reserva</h3>
    </div>

    <div *ngIf="mensagemSucesso" class="toast toast-sucesso">
      {{ mensagemSucesso }}
    </div>

    <div *ngIf="mensagemErro" class="toast toast-erro">
      {{ mensagemErro }}
    </div>

    <form class="form-grid form-grid-reserva">
      <input
        type="text"
        [(ngModel)]="novaReservaPorNumero.nomeDoHospede"
        placeholder="Nome do hospede"
        name="nomeDoHospede">
      <input
        type="text"
        [(ngModel)]="novaReservaPorNumero.numeroDoQuarto"
        placeholder="Numero do quarto"
        name="numeroDoQuarto">
      <input
        type="date"
        [(ngModel)]="novaReservaPorNumero.checkIn"
        name="checkIn">
      <input
        type="date"
        [(ngModel)]="novaReservaPorNumero.checkOut"
        name="checkOut">
      <button type="button" class="btn-secondary" (click)="criarReservaPorNumero()" [disabled]="salvando">{{ salvando ? 'Salvando...' : 'Salvar' }}</button>
    </form>
  </div>

  <!-- HEADER -->
  <div class="timeline-header">
    <div class="quarto-label">Quartos</div>
    <div class="dias-header">
      <div *ngFor="let dia of dias" class="dia-header">
        {{ dia | date:'dd/MM' }}
        <div class="dia-weekday">{{ dia | date:'EEE' }}</div>
      </div>
    </div>
  </div>

  <!-- LINHAS DE QUARTOS -->
  <div *ngFor="let quarto of quartos" class="quarto-row">
    <div class="quarto-info">
      <div class="quarto-number">{{ quarto.numero }}</div>
      <div class="quarto-type">{{ quarto.tipo }}</div>
    </div>

    <div class="timeline-row">
      <div *ngFor="let dia of dias" class="timeline-cell"></div>

      <!-- Blocos de reservas -->
      <ng-container *ngFor="let reserva of quarto.reservaList || []">
        <div *ngIf="reservaEstaVisivel(reserva)"
          class="reserva-card"
          [ngClass]="{
            'reserva-card-pendente': reserva.status === 'Pendente',
            'reserva-card-checkin': reserva.status === 'CheckIn',
            'reserva-card-checkout': reserva.status === 'CheckOut'
          }"
          [style.left.%]="getOffset(reserva) * (100 / dias.length)"
          [style.width.%]="getDuracao(reserva) * (100 / dias.length)"
          title="{{ reserva.nomeDoHospede }} ({{ getDuracao(reserva) | number:'1.0-0' }} dias)"
          (click)="exibirDetalhesReserva(reserva)">
          {{ reserva.nomeDoHospede }}
        </div>
      </ng-container>
    </div>
  </div>
</section>
