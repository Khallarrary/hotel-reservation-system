<header class="app-shell-header">
  <div class="app-shell-inner">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div>
        <strong>Hotel Reservation</strong>
        <span>Sistema de reservas</span>
      </div>
    </div>

    <nav *ngIf="!estaNaTelaDeLogin()" class="app-tabs" aria-label="Navegacao principal">
      <a
        routerLink="/reservas"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        Mapa de Reservas
      </a>
      <a
        routerLink="/reservas-lista"
        routerLinkActive="active">
        Lista de Reservas
      </a>
    </nav>
  </div>
</header>

<router-outlet></router-outlet>
