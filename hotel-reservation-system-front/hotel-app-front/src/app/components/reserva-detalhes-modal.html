<div *ngIf="reserva" class="modal-backdrop" (click)="aoFechar()">
    <div class="modal-reserva" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div>
          <span class="modal-eyebrow">Reserva #{{ reserva.id }}</span>
          <h3>Detalhes da Reserva</h3>
        </div>
        <span
          class="status-badge"
          [ngClass]="{
            'status-pendente': reserva.status === 'Pendente',
            'status-checkin': reserva.status === 'CheckIn',
            'status-checkout': reserva.status === 'CheckOut',
            'status-cancelada': reserva.status === 'Cancelada'
          }">
          {{ reserva.status }}
        </span>
        <button type="button" class="modal-close" (click)="aoFechar()">
          x
        </button>
      </div>

      <div class="modal-body">
        <div class="modal-field modal-field-full">
          <span>Hospede</span>
          <strong>{{ reserva.nomeDoHospede }}</strong>
        </div>

        <div class="modal-field">
          <span>Check-in</span>
          <strong>{{ formatarDataApi(reserva.checkIn) }}</strong>
        </div>

        <div class="modal-field">
          <span>Check-out</span>
          <strong>{{ formatarDataApi(reserva.checkOut) }}</strong>
        </div>

        <div class="modal-field">
          <span>Quarto ID</span>
          <strong>{{ reserva.quartoId }}</strong>
        </div>

        <div class="modal-field">
          <span>ID da reserva</span>
          <strong>{{ reserva.id }}</strong>
        </div>
      </div>

      <div class="modal-actions">
        <div class="btn-disabled-wrapper" (click)="tentarAcaoPrincipal()">
          <button type="button" class="btn-modal btn-modal-primary" [disabled]="!podeExecutarAcaoPrincipal()">
            {{ obterTextoAcaoPrincipal() }}
          </button>
        </div>
        <button 
        type="button" 
        class="btn-modal btn-modal-danger" 
        (click)="aoCancelar()">
        Cancelar
        </button>
        <button type="button" class="btn-modal btn-modal-muted">Caixa</button>
      </div>

      <div *ngIf="mensagemAcaoPrincipal" class="modal-warning">
        {{ mensagemAcaoPrincipal }}
      </div>
    </div>
  </div>
