name: CodeQL

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  analisar:
    name: Analisar ${{ matrix.language }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual

          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restaurar dependências do backend
        if: matrix.language == 'csharp'
        run: dotnet restore ./hotel-reservation-system-back/HotelApp.slnx

      - name: Compilar backend para análise
        if: matrix.language == 'csharp'
        run: >
          dotnet build ./hotel-reservation-system-back/HotelApp.slnx
          --configuration Release
          --no-restore

      - name: Executar análise
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
