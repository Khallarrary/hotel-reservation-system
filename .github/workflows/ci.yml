name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Baixar código
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Configurar .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar dependências
      run: dotnet restore ./hotel-reservation-system-back/HotelApp.slnx

    - name: Compilar Backend
      run: dotnet build ./hotel-reservation-system-back/HotelApp.slnx --configuration Release --no-restore

    - name: Executar testes com cobertura
      run: >
        dotnet test ./hotel-reservation-system-back/HotelApp.slnx
        --configuration Release
        --no-build
        --collect:"XPlat Code Coverage"
        --results-directory ./coverage

    - name: Gerar resumo da cobertura
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: coverage/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_complexity: true
        output: both
        thresholds: '50 75'
    
    - name: Guardar resumo da cobertura
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: backend-coverage
        path: code-coverage-results.md

  coverage-comment:
    name: Comentar cobertura
    needs: backend
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Baixar resumo da cobertura
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage

      - name: Comentar cobertura no pull request
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: backend-coverage
          path: code-coverage-results.md

  frontend:
    runs-on: ubuntu-latest

    steps: 
    - name: Baixar código
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Configurar Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: hotel-reservation-system-front/hotel-app-front/package-lock.json

    - name: Configurar npm
      run: npm install --global npm@11.19.1

    - name: Instalar dependências
      working-directory: ./hotel-reservation-system-front/hotel-app-front
      run: npm ci

    - name: Compilar Frontend
      working-directory: ./hotel-reservation-system-front/hotel-app-front
      run: npm run build

    - name: Guardar build do frontend
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: frontend-build
        path: hotel-reservation-system-front/hotel-app-front/dist/hotel-app-front/browser
        retention-days: 1

  migration-check:
    name: Validar migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: hotelapp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d hotelapp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      HOTELAPP_CONNECTION: Host=localhost;Port=5432;Database=hotelapp_ci;Username=postgres;Password=postgres

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Instalar ferramenta do Entity Framework
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Restaurar dependências
        run: dotnet restore ./hotel-reservation-system-back/HotelApp.slnx

      - name: Validar migrations no PostgreSQL temporário
        run: |
          dotnet ef database update \
            --project ./hotel-reservation-system-back/HotelApp.Infrastructure \
            --startup-project ./hotel-reservation-system-back/HotelApp.Api

  migrate-database:
    needs: [backend, frontend, migration-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Autenticar no Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Liberar IP do runner no PostgreSQL
        run: |
          RUNNER_IP=$(curl --fail --silent https://api.ipify.org)
          RULE_NAME="github-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          az postgres flexible-server firewall-rule create \
            --resource-group rg-hotelapp-demo \
            --server-name pg-hotelapp-demo-9882 \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" \
            --output none

          echo "FIREWALL_RULE_NAME=$RULE_NAME" >> "$GITHUB_ENV"

      - name: Obter connection string do Azure
        run: |
          CONNECTION_STRING=$(az webapp config appsettings list \
            --resource-group rg-hotelapp-demo \
            --name hotelapp-api-demo-8066 \
            --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" \
            --output tsv)

          if [ -z "$CONNECTION_STRING" ]; then
            echo "Connection string não encontrada."
            exit 1
          fi

          echo "::add-mask::$CONNECTION_STRING"
          echo "HOTELAPP_CONNECTION=$CONNECTION_STRING" >> "$GITHUB_ENV"

      - name: Instalar ferramenta do Entity Framework
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Restaurar dependências
        run: dotnet restore ./hotel-reservation-system-back/HotelApp.slnx

      - name: Aplicar migrations
        run: |
          dotnet ef database update \
            --project ./hotel-reservation-system-back/HotelApp.Infrastructure \
            --startup-project ./hotel-reservation-system-back/HotelApp.Api \
            --connection "$HOTELAPP_CONNECTION"

      - name: Remover acesso temporário ao PostgreSQL
        if: always()
        run: |
          if [ -n "${FIREWALL_RULE_NAME:-}" ]; then
            az postgres flexible-server firewall-rule delete \
              --resource-group rg-hotelapp-demo \
              --server-name pg-hotelapp-demo-9882 \
              --name "$FIREWALL_RULE_NAME" \
              --yes
          fi

  deploy-backend:
    needs: [backend, frontend, migrate-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Autenticar no Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Autenticar no ACR
        run: az acr login --name acrhotelapp7910

      - name: Construir e publicar imagem
        run: |
          IMAGE="acrhotelapp7910.azurecr.io/hotelapp-api:${{ github.sha }}"
          docker build -t "$IMAGE" ./hotel-reservation-system-back
          docker push "$IMAGE"

      - name: Atualizar API no Azure
        run: |
          IMAGE="acrhotelapp7910.azurecr.io/hotelapp-api:${{ github.sha }}"
          az webapp config container set \
            --resource-group rg-hotelapp-demo \
            --name hotelapp-api-demo-8066 \
            --container-image-name "$IMAGE" \
            --output none
          az webapp restart \
            --resource-group rg-hotelapp-demo \
            --name hotelapp-api-demo-8066

  deploy-frontend:
    needs: [backend, frontend, migrate-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar build validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Preparar pacote ZIP
        run: |
          cd frontend-build
          zip -r ../hotelapp-front.zip .

      - name: Autenticar no Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publicar frontend no Azure
        run: |
          az webapp deploy \
            --resource-group rg-hotelapp-demo \
            --name hotelapp-front-demo-3567 \
            --src-path hotelapp-front.zip \
            --type zip \
            --clean true \
            --restart true
